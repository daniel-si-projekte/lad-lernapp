<body>
<div class="app">
<div class="top"><div class="title"><h1>Prüfung: Geprüfte/r Fachmann/-frau für Versicherungsvermittlung IHK</h1><p id="subtitle">Proximus 5 Übungssimulation</p></div><div class="logo"><div class="box">LAD</div></div></div>
<div class="band" id="band">Start</div>
<div class="main"><aside class="left"><div class="timer"><span class="glass">⌛</span><div>Verbleibende Zeit:</div><div id="time">--:--</div></div></aside><main class="content" id="screen"></main><aside class="right"></aside></div>
<div class="bottom"><button class="btn" id="overviewBtn">Übersicht</button><button class="btn navbtn" id="prevBtn">◀</button><button class="btn navbtn" id="nextBtn">▶</button><button class="btn" id="markBtn">Markieren</button><button class="btn" id="calcBtn">Rechnen</button><button class="btn" id="notesBtn">Notizen</button><button class="btn" id="infoBtn">Info</button><button class="btn" id="historyBtn">Historie</button><button class="btn danger" id="finishBtn">Prüfung beenden</button></div>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
let BANK=[];
const $=id=>document.getElementById(id);
const OLD_HISTORY_KEY='history34d_proximus5_v1';
const HISTORY_PREFIX='history34d_proximus5_v7_';
const PROFILE_STORE_KEY='lad34d_profiles_v1';
const ACTIVE_PROFILE_KEY='lad34d_active_profile_v1';
const GROUPS={
 A:{name:'A Private Vorsorge, gesetzliche Rentenversicherung, bAV',short:'A Private Vorsorge'},
 B:{name:'B Unfall, Kranken, Pflege',short:'B Unfall, Kranken, Pflege'},
 C:{name:'C Rechtliche Grundlagen',short:'C Rechtliche Grundlagen'},
 D:{name:'D Hausrat und Gebäude',short:'D Hausrat, Gebäude'},
 E:{name:'E Haftpflicht, Rechtsschutz, Kraftfahrt',short:'E Haftpflicht, Rechtsschutz, Kfz'}
};
const GROUP_ORDER=['A','B','C','D','E'];
const EXAM_DIST={A:30,B:22,C:18,D:22,E:26};
const EXAM_TYPE_TARGET={A:{short:5,multiple:4},B:{short:4,multiple:3},C:{short:1,multiple:3},D:{short:5,multiple:3},E:{short:4,multiple:4}};
let INFO_PAGES=[];
let GLOSSARY=[];
let state={mode:'start',questions:[],answers:[],confirmed:[],marked:[],notes:[],current:0,seed:'',rng:null,timer:null,remaining:0,part1Done:false,startTime:0,topic:'all',learnCount:'40',finished:false};
function hashSeed(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clone(o){return JSON.parse(JSON.stringify(o))}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function promptHtml(s){return escapeHtml(s).replace(/\n/g,'<br>')}
function baseKey(q){return q.seed_id||q.uid||q.category+'|'+String(q.prompt).slice(0,80)}
function getCategories(){return [...new Set(BANK.map(q=>q.category))].sort((a,b)=>a.localeCompare(b,'de'))}
function topicOptions(){let html='<option value="all">Alle Bereiche</option>';html+='<option value="P|1">Prüfungsteil 1</option><option value="P|2">Prüfungsteil 2</option>';html+='<option value="S|numeric">Nur Rechenaufgaben</option><option value="S|triple">Nur Triple Choice Fragen</option>';html+='<option disabled>──────────</option>';GROUP_ORDER.forEach(g=>{html+=`<option value="G|${g}">${GROUPS[g].short}</option>`});html+='<option disabled>──────────</option>';getCategories().forEach(c=>{html+=`<option value="C|${escapeAttr(c)}">${escapeHtml(c)}</option>`});return html}

function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function topicLabel(v){if(!v||v==='all')return 'Alle Bereiche';if(v==='P|1')return 'Prüfungsteil 1';if(v==='P|2')return 'Prüfungsteil 2';if(v==='S|numeric')return 'Nur Rechenaufgaben';if(v==='S|triple')return 'Nur Triple Choice Fragen';if(v.startsWith('G|'))return GROUPS[v.slice(2)]?.short||v;if(v.startsWith('C|'))return v.slice(2);return v}

function filteredByTopic(topic){if(!topic||topic==='all')return BANK.slice();if(topic==='P|1')return BANK.filter(q=>(q.part||1)===1);if(topic==='P|2')return BANK.filter(q=>(q.part||1)===2);if(topic==='S|numeric')return BANK.filter(q=>q.numeric===true);if(topic==='S|triple')return BANK.filter(q=>q.type==='multiple'&&Array.isArray(q.answer)&&q.answer.length===3);if(topic.startsWith('G|'))return BANK.filter(q=>q.group===topic.slice(2));if(topic.startsWith('C|'))return BANK.filter(q=>q.category===topic.slice(2));return BANK.slice()}


function makeProfileId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function getProfiles(){let ps=[];try{ps=JSON.parse(localStorage.getItem(PROFILE_STORE_KEY)||'[]')}catch(e){ps=[]}if(!Array.isArray(ps)||!ps.length){let id=makeProfileId();ps=[{id,name:'Mein Profil'}];try{localStorage.setItem(PROFILE_STORE_KEY,JSON.stringify(ps));localStorage.setItem(ACTIVE_PROFILE_KEY,id);let old=localStorage.getItem(OLD_HISTORY_KEY);if(old&&!localStorage.getItem(HISTORY_PREFIX+id))localStorage.setItem(HISTORY_PREFIX+id,old)}catch(e){}}return ps}
function saveProfiles(ps){try{localStorage.setItem(PROFILE_STORE_KEY,JSON.stringify(ps))}catch(e){}}
function getActiveProfile(){let ps=getProfiles();let id=localStorage.getItem(ACTIVE_PROFILE_KEY);let p=ps.find(x=>x.id===id)||ps[0];if(p)try{localStorage.setItem(ACTIVE_PROFILE_KEY,p.id)}catch(e){}return p||{id:'default',name:'Mein Profil'}}
function historyStorageKey(){return HISTORY_PREFIX+getActiveProfile().id}
function profileOptions(){let active=getActiveProfile();return getProfiles().map(p=>`<option value="${escapeAttr(p.id)}" ${p.id===active.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
function activateProfile(id){let ps=getProfiles();if(ps.some(p=>p.id===id)){localStorage.setItem(ACTIVE_PROFILE_KEY,id);renderHistoryStart()}}
function renameActiveProfile(){let input=$('profileName');if(!input)return;let name=input.value.trim()||'Mein Profil';let ps=getProfiles();let p=getActiveProfile();ps=ps.map(x=>x.id===p.id?{...x,name}:x);saveProfiles(ps);showStart()}
function createProfile(){let name=prompt('Name des neuen Profils','Neues Profil');if(!name)return;let ps=getProfiles();let id=makeProfileId();ps.push({id,name:name.trim()||'Neues Profil'});saveProfiles(ps);localStorage.setItem(ACTIVE_PROFILE_KEY,id);showStart()}

function selectUnique(candidates,count,rng){let map=new Map();candidates.forEach(q=>{let k=baseKey(q);if(!map.has(k))map.set(k,[]);map.get(k).push(q)});let keys=[...map.keys()];shuffle(keys,rng);let out=[];for(const k of keys){let arr=map.get(k);out.push(clone(arr[Math.floor(rng()*arr.length)]));if(count!=='all'&&out.length>=count)break}if(count!=='all'&&out.length<count){let pool=candidates.map(clone);shuffle(pool,rng);for(const q of pool){out.push(q);if(out.length>=count)break}}
return out}

function selectExamGroup(group,count,rng){
  const candidates=BANK.filter(q=>q.group===group);
  const targets=EXAM_TYPE_TARGET[group]||{};
  let picked=[];let used=new Set();
  function pickType(type,n){
    if(!n||n<=0)return;
    let pool=candidates.filter(q=>q.type===type&&!used.has(baseKey(q)));
    let sel=selectUnique(pool,n,rng);
    sel.forEach(q=>{if(!used.has(baseKey(q))){picked.push(q);used.add(baseKey(q))}});
  }
  pickType('short',targets.short||0);
  pickType('multiple',targets.multiple||0);
  let fillPool=candidates.filter(q=>q.type==='single'&&!used.has(baseKey(q)));
  let fill=selectUnique(fillPool,Math.max(0,count-picked.length),rng);
  fill.forEach(q=>{if(!used.has(baseKey(q))&&picked.length<count){picked.push(q);used.add(baseKey(q))}});
  if(picked.length<count){
    let restPool=candidates.filter(q=>!used.has(baseKey(q)));
    let rest=selectUnique(restPool,count-picked.length,rng);
    rest.forEach(q=>{if(!used.has(baseKey(q))&&picked.length<count){picked.push(q);used.add(baseKey(q))}});
  }
  return picked.slice(0,count);
}

function prepareQuestions(list,rng){return list.map((q,idx)=>{let x=clone(q);x.part=x.part||(x.group==='D'||x.group==='E'?2:1);if(x.type==='single'||x.type==='multiple'){let pairs=(x.options||[]).map((t,i)=>({t,i}));shuffle(pairs,rng);x.shuffled=pairs.map(p=>p.t);if(x.type==='single'){x.correct=pairs.findIndex(p=>p.i===x.answer)}else{x.correct=pairs.map((p,i)=>Array.isArray(x.answer)&&x.answer.includes(p.i)?i:null).filter(v=>v!==null)}}else{x.correct=x.answer}x.sessionId=idx;return x})}
function showStart(){clearInterval(state.timer);state={...state,mode:'start',questions:[],answers:[],confirmed:[],marked:[],notes:[],current:0,remaining:0,part1Done:false,finished:false};$('subtitle').textContent='Proximus 5 Übungssimulation';$('band').textContent='Start';$('time').textContent='--:--';$('finishBtn').textContent='Prüfung beenden';toggleControls(false);document.querySelector('.content').scrollTop=0;let active=getActiveProfile();$('screen').innerHTML=`<div class="start"><h2>LAD 34d Prüfungssimulation Proximus 5</h2><p>Prüfungsmodus, Lernmodus nach Themenbereich, Prüfungsteil, Rechenaufgaben und Triple Choice, Antwortbestätigung im Lernmodus, Zahlenfragen, Historie und Verzeichnis.</p><p class="brandNotice">LAD Lernsimulation. Nicht offiziell von einer Kammer herausgegeben.</p><p class="profileBadge">Angemeldet: ${escapeHtml(active.name)}</p><div class="cards"><div class="card"><h3>Prüfungsmodus</h3><p>118 Aufgaben nach Bereichsverteilung. Teil 1 läuft mit 90 Minuten. Teil 2 läuft mit 70 Minuten.</p><div class="field"><label for="seedInput">Seed, optional</label><input id="seedInput" placeholder="leer lassen für neue Prüfung"></div><button class="btn" onclick="startExam()">Prüfung starten</button></div><div class="card"><h3>Prüfungsteil 1 einzeln</h3><p>70 Aufgaben aus den Sachgebieten A, B und C. 90 Minuten wie in der Prüfung.</p><button class="btn" onclick="startExamPart(1)">Teil 1 starten</button></div><div class="card"><h3>Prüfungsteil 2 einzeln</h3><p>48 Aufgaben aus den Sachgebieten D und E. 70 Minuten wie in der Prüfung.</p><button class="btn" onclick="startExamPart(2)">Teil 2 starten</button></div><div class="card"><h3>Lernmodus</h3><p>Gezielt nach Bereich, Prüfungsteil, Rechenaufgaben oder Triple Choice üben. Die Lösung erscheint erst nach Antwort bestätigen.</p><div class="field"><label for="studyTopic">Lernfilter</label><select id="studyTopic">${topicOptions()}</select><div class="topicNote">Prüfungsteil 1, Prüfungsteil 2, einzelne Themen, Rechenaufgaben oder Triple Choice sind separat trainierbar.</div></div><div class="field"><label for="learnCount">Anzahl</label><select id="learnCount"><option value="20">20 Lernfragen</option><option value="40" selected>40 Lernfragen</option><option value="60">60 Lernfragen</option><option value="118">118 Lernfragen</option><option value="all">Alle verfügbaren Grundfragen im Filter</option></select></div><div class="field"><label for="learnSeedInput">Seed, optional</label><input id="learnSeedInput" placeholder="leer lassen für neue Auswahl"></div><button class="btn" onclick="startLearning()">Lernmodus starten</button></div><div class="card"><h3>Historie</h3><div id="historyStart" class="small"></div><div class="row"><button class="btn secondary" onclick="showHistory()">Historie anzeigen</button><button class="btn secondary" onclick="exportHistory()">CSV exportieren</button><button class="btn secondary" onclick="clearHistory()">Historie löschen</button></div></div>${profilePanelHtml()}<div class="card"><h3>Info PDF</h3><p>Prüfungsrelevante Werte und Proximus Hinweise wie in der Prüfung aufrufbar.</p><button class="btn secondary" onclick="showInfo()">Info öffnen</button></div><div class="card"><h3>Verzeichnis</h3><p>Wichtige Begriffe aus 34d, Proximus 5 und den prüfungsrelevanten Sparten kurz erklärt.</p><button class="btn secondary" onclick="showGlossary()">Verzeichnis öffnen</button></div></div><h3>Fragenbank</h3><p><span class="pill">${BANK.length} Fragen und Varianten</span><span class="pill">${BANK.filter(q=>q.numeric).length} Rechenaufgaben</span><span class="pill">${BANK.filter(q=>q.type==='multiple'&&Array.isArray(q.answer)&&q.answer.length===3).length} Triple Choice Varianten</span><span class="pill">Mehrfachauswahl mit 3 und 4 richtigen Antworten</span><span class="pill">Proximus Bezug</span></p></div>`;renderHistoryStart()}

function toggleControls(on){['overviewBtn','prevBtn','nextBtn','markBtn','calcBtn','notesBtn','finishBtn'].forEach(id=>{$(id).disabled=!on});$('infoBtn').disabled=false;$('historyBtn').disabled=false}
function makeSeed(prefix){return prefix+'-'+new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+Math.floor(Math.random()*99999)}
function startExam(){let seed=($('seedInput')?.value||'').trim()||makeSeed('P');let rng=mulberry32(hashSeed(seed));let part1=[],part2=[];GROUP_ORDER.forEach(g=>{let selected=selectExamGroup(g,EXAM_DIST[g],rng);if(g==='A'||g==='B'||g==='C')part1.push(...selected);else part2.push(...selected)});shuffle(part1,rng);shuffle(part2,rng);state={mode:'exam',questions:prepareQuestions(part1.concat(part2),rng),answers:[],confirmed:[],marked:[],notes:[],current:0,seed,rng,timer:null,remaining:0,part1Done:false,startTime:Date.now(),topic:'Prüfung',learnCount:'118',finished:false};toggleControls(true);$('finishBtn').textContent='Prüfung beenden';setTimer(90*60);renderQuestion()}
function startLearning(topicArg,countArg){let topic=topicArg||$('studyTopic')?.value||'all';let countVal=countArg||$('learnCount')?.value||'40';let seed=($('learnSeedInput')?.value||'').trim()||makeSeed('L');let rng=mulberry32(hashSeed(seed));let candidates=filteredByTopic(topic);let count=countVal==='all'?'all':Number(countVal);let selected=selectUnique(candidates,count,rng);shuffle(selected,rng);state={mode:'learn',questions:prepareQuestions(selected,rng),answers:[],confirmed:[],marked:[],notes:[],current:0,seed,rng,timer:null,remaining:0,part1Done:true,startTime:Date.now(),topic,learnCount:countVal,finished:false};toggleControls(true);$('finishBtn').textContent='Lernmodus beenden';$('time').textContent='--:--';renderQuestion()}
function setTimer(seconds){clearInterval(state.timer);state.remaining=seconds;updateTimer();state.timer=setInterval(()=>{state.remaining--;updateTimer();if(state.remaining<=0){finishSession(true)}},1000)}
function updateTimer(){let s=Math.max(0,state.remaining||0);let m=Math.floor(s/60);let sec=s%60;$('time').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function currentPartIndex(i=state.current){let q=state.questions[i];let p=q?.part||1;return state.questions.slice(0,i+1).filter(x=>(x.part||1)===p).length}
function isAnswered(q,a){if(q.type==='single')return typeof a==='number';if(q.type==='multiple')return Array.isArray(a)&&a.length>0;return a!==undefined&&String(a).trim()!==''}
function renderQuestion(){if(!state.questions.length){showStart();return}let q=state.questions[state.current];$('subtitle').textContent=state.mode==='exam'?`Schriftlicher Prüfungsteil ${q.part}`:'Lernmodus';$('band').textContent=q.category;let pct=((state.current+1)/state.questions.length)*100;let typeText=q.type==='single'?'Einfachauswahl':q.type==='multiple'?'Mehrfachauswahl':'Eingabe';let input=buildAnswerInput(q);let confirmed=state.mode==='learn'&&state.confirmed[state.current];let feedback=confirmed?feedbackBlock(q):'<div id="feedbackArea"></div>';let confirmBtn=state.mode==='learn'?`<p><button class="btn secondary" onclick="confirmAnswer()">Antwort bestätigen</button></p>`:'';$('screen').innerHTML=`<div class="sectionbar"><span>${escapeHtml(q.category)}</span><span class="task">Aufgabe ${currentPartIndex()}</span></div><div class="statusline"><div class="tags"><span class="pill">Teil ${q.part}</span><span class="pill">${q.group}</span><span class="pill">${typeText}</span>${q.numeric?'<span class="pill">Rechenaufgabe</span>':''}</div><div class="small muted">${state.current+1} von ${state.questions.length}</div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="question"><div class="prompt">${promptHtml(q.prompt)}</div>${input}${confirmBtn}${feedback}</div>`;$('markBtn').className=state.marked[state.current]?'btn secondary':'btn';$('prevBtn').disabled=state.current===0;$('nextBtn').disabled=state.current===state.questions.length-1;$('finishBtn').disabled=false}
function buildAnswerInput(q){let ans=state.answers[state.current];let confirmed=state.mode==='learn'&&state.confirmed[state.current];if(q.type==='single'){return '<div class="options">'+q.shuffled.map((o,i)=>{let selected=ans===i;let cls='opt';if(confirmed&&i===q.correct)cls+=' correct';if(confirmed&&selected&&i!==q.correct)cls+=' wrong';return `<label class="${cls}"><input type="radio" name="ans" value="${i}" ${selected?'checked':''} onchange="saveSingle(${i})"><span>${escapeHtml(o)}</span></label>`}).join('')+'</div>'}if(q.type==='multiple'){let arr=Array.isArray(ans)?ans:[];return '<p class="small muted">Es können mehrere Antworten richtig sein.</p><div class="options">'+q.shuffled.map((o,i)=>{let selected=arr.includes(i);let cls='opt';if(confirmed&&q.correct.includes(i))cls+=' correct';if(confirmed&&selected&&!q.correct.includes(i))cls+=' wrong';return `<label class="${cls}"><input type="checkbox" value="${i}" ${selected?'checked':''} onchange="saveMulti(${i},this.checked)"><span>${escapeHtml(o)}</span></label>`}).join('')+'</div>'}let val=escapeHtml(ans??'');return `<div class="short"><input id="shortInput" value="${val}" placeholder="Antwort eingeben" inputmode="decimal" oninput="saveShort(this.value)"> <span>Euro</span></div><div class="inputHint">Hinweis<br>Eintrag in Euro ohne Trennpunkte, also z. B. 1212 für eintausendzweihundertzwölf Euro.</div>`}
function saveSingle(i){state.answers[state.current]=i;if(state.mode==='learn')state.confirmed[state.current]=false;renderQuestion()}
function saveMulti(i,checked){let arr=Array.isArray(state.answers[state.current])?[...state.answers[state.current]]:[];if(checked&&!arr.includes(i))arr.push(i);if(!checked)arr=arr.filter(x=>x!==i);state.answers[state.current]=arr;if(state.mode==='learn')state.confirmed[state.current]=false;renderQuestion()}
function saveShort(v){state.answers[state.current]=v;if(state.mode==='learn')state.confirmed[state.current]=false;let fb=$('feedbackArea');if(fb)fb.innerHTML=''}
function confirmAnswer(){let q=state.questions[state.current];if(!isAnswered(q,state.answers[state.current])){openModal('<h2>Antwort fehlt</h2><p>Geben Sie zuerst eine Antwort ein oder wählen Sie mindestens eine Antwort aus.</p><button class="btn secondary" onclick="closeModal()">Schließen</button>');return}state.confirmed[state.current]=true;renderQuestion()}
function go(delta){let next=state.current+delta;if(next<0||next>=state.questions.length)return;if(state.mode==='exam'&&!state.part1Done&&state.questions[state.current].part===1&&state.questions[next].part===2){openModal('<h2>Prüfungsteil 1 beenden</h2><p>Sie wechseln jetzt zu Prüfungsteil 2. Der Timer wird auf 70 Minuten gesetzt.</p><button class="btn secondary" onclick="confirmPart2()">Teil 2 starten</button> <button class="btn secondary" onclick="closeModal()">Zurück</button>');return}state.current=next;renderQuestion()}
function confirmPart2(){state.part1Done=true;closeModal();state.current++;setTimer(70*60);renderQuestion()}
function parseNumber(v){if(typeof v==='number')return v;let s=String(v??'').toLowerCase().replace(/euro|eur|€/g,'').replace(/\s/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else{s=s.replace(/\.(?=\d{3}(\D|$))/g,'')}s=s.replace(/[^0-9.\-]/g,'');return Number(s)}
function normText(v){return String(v??'').toLowerCase().replace(/euro|eur|€/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',', '.')}
function isCorrect(q,a){if(!isAnswered(q,a))return false;if(q.type==='single')return a===q.correct;if(q.type==='multiple'){let x=[...a].sort((m,n)=>m-n).join(',');let y=[...q.correct].sort((m,n)=>m-n).join(',');return x===y}if(q.numeric){let user=parseNumber(a);let expected=parseNumber(q.answer);let tol=Number(q.tolerance??0.01);return Number.isFinite(user)&&Number.isFinite(expected)&&Math.abs(user-expected)<=tol}let answers=Array.isArray(q.answer)?q.answer:[q.answer];return answers.some(x=>normText(x)===normText(a))}
function answerText(q){if(q.type==='single')return q.shuffled[q.correct];if(q.type==='multiple')return q.correct.map(i=>q.shuffled[i]).join(' | ');if(q.numeric)return formatNumber(q.answer)+' Euro';return Array.isArray(q.answer)?q.answer[0]:q.answer}
function userText(q,a){if(!isAnswered(q,a))return 'Keine Antwort';if(q.type==='single')return q.shuffled[a]??'Keine Antwort';if(q.type==='multiple')return a.map(i=>q.shuffled[i]).join(' | ')||'Keine Antwort';return String(a)}
function formatNumber(v){let n=parseNumber(v);if(!Number.isFinite(n))return String(v);return Math.round(n*100)/100}
function feedbackBlock(q){let a=state.answers[state.current];let ok=isCorrect(q,a);return `<div class="feedback" id="feedbackArea"><div class="${ok?'ok':'bad'}">${ok?'Richtig':'Falsch'}</div><p><strong>Richtige Antwort:</strong> ${escapeHtml(answerText(q))}</p><p><strong>Begründung:</strong> ${escapeHtml(q.explanation)}</p><p><strong>Proximus Bezug:</strong> ${escapeHtml(q.ref)}</p></div>`}

function showOverview(){if(!state.questions.length){showStart();return}const cells=state.questions.map((q,i)=>{const ans=isAnswered(q,state.answers[i]);const cls=['qcell',ans?'answered':'',state.marked[i]?'marked':'',i===state.current?'current':''].join(' ');return `<div class="${cls}" onclick="state.current=${i};closeModal();renderQuestion()">${q.part}.${state.questions.slice(0,i+1).filter(x=>x.part===q.part).length}</div>`}).join('');openModal(`<h2>Übersicht</h2><p class="muted">Blau bedeutet beantwortet. Orange markiert bedeutet zur Nacharbeit markiert.</p><div class="grid">${cells}</div><p style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">Schließen</button></p>`)}
function showNotes(){if(!state.questions.length)return;const val=escapeHtml(state.notes[state.current]||'');openModal(`<h2>Notizen zu Aufgabe ${state.questions[state.current].part}.${currentPartIndex()}</h2><textarea class="notes" id="noteText">${val}</textarea><p><button class="btn secondary" onclick="state.notes[state.current]=document.getElementById('noteText').value;closeModal()">Speichern</button> <button class="btn secondary" onclick="closeModal()">Schließen</button></p>`)}
function showCalc(){openModal(`<h2>Rechner</h2><div class="calc"><input id="calcDisplay" readonly><div class="keys">${['7','8','9','/','4','5','6','*','1','2','3','-','0',',','=','+','C'].map(k=>`<button class="btn secondary" onclick="calcKey('${k}')">${k}</button>`).join('')}</div></div><p><button class="btn secondary" onclick="closeModal()">Schließen</button></p>`)}
function calcKey(k){const d=$('calcDisplay');if(k==='C'){d.value='';return}if(k==='='){try{let exp=d.value.replace(/,/g,'.');if(!/^[0-9+\-*/().\s]+$/.test(exp))throw new Error('bad');d.value=String(Function('return '+exp)()).replace('.',',')}catch(e){d.value='Fehler'}return}d.value+=k}

function requestFinish(){if(!state.questions.length)return;let text=state.mode==='exam'?'Prüfung wirklich beenden?':'Lernmodus wirklich beenden?';openModal(`<h2>${text}</h2><p>Danach wird die Auswertung erstellt und in der Historie gespeichert.</p><button class="btn secondary" onclick="closeModal();finishSession(false)">Beenden und auswerten</button> <button class="btn secondary" onclick="closeModal()">Zurück</button>`)}
function computeStats(){let group={},cat={},correct=0;state.questions.forEach((q,i)=>{group[q.group]??={right:0,total:0};group[q.group].total++;cat[q.category]??={right:0,total:0};cat[q.category].total++;if(isCorrect(q,state.answers[i])){correct++;group[q.group].right++;cat[q.category].right++}});return{correct,total:state.questions.length,group,cat}}
function pct(a,b){return b?Math.round((a*1000)/b)/10:0}
function finishSession(auto){clearInterval(state.timer);if(!state.questions.length)return;state.finished=true;let stats=computeStats();let entry=saveHistory(stats);renderResult(stats,entry,auto)}
function saveHistory(stats){let groups={},cats={};Object.entries(stats.group).forEach(([k,v])=>groups[k]={c:v.right,n:v.total,p:pct(v.right,v.total)});Object.entries(stats.cat).forEach(([k,v])=>cats[k]={c:v.right,n:v.total,p:pct(v.right,v.total)});let entry={id:Date.now(),date:new Date().toISOString(),mode:state.mode,seed:state.seed,total:stats.total,correct:stats.correct,percent:pct(stats.correct,stats.total),groups,categories:cats,durationSec:Math.max(0,Math.round((Date.now()-state.startTime)/1000)),topic:state.topic,learnCount:state.learnCount};let h=getHistory();h.push(entry);setHistory(h);return entry}

function startExam(){
  closeModal();
  const seed=($('seedInput')?.value||'').trim()||makeSeed('P');
  const rng=mulberry32(hashSeed(seed));
  const part1=[],part2=[];
  GROUP_ORDER.forEach(g=>{
    const selected=selectExamGroup(g,EXAM_DIST[g],rng);
    if(g==='A'||g==='B'||g==='C')part1.push(...selected);else part2.push(...selected);
  });
  shuffle(part1,rng);shuffle(part2,rng);
  state={mode:'exam',questions:prepareQuestions(part1.concat(part2),rng),answers:[],confirmed:[],marked:[],notes:[],current:0,seed,rng:null,timer:null,remaining:0,deadline:0,part1Done:false,inBreak:false,breakReason:'',startTime:Date.now(),topic:'Prüfung',learnCount:'118',finished:false};
  toggleControls(true);
  $('finishBtn').textContent='Prüfung beenden';
  setTimer(90*60);
  renderQuestion();
}
function startLearning(topicArg,countArg){
  closeModal();
  const topic=topicArg||$('studyTopic')?.value||'all';
  const countVal=countArg||$('learnCount')?.value||'40';
  const seed=($('learnSeedInput')?.value||'').trim()||makeSeed('L');
  const rng=mulberry32(hashSeed(seed));
  const candidates=filteredByTopic(topic);
  const count=countVal==='all'?'all':Number(countVal);
  const selected=selectUnique(candidates,count,rng);
  shuffle(selected,rng);
  state={mode:'learn',questions:prepareQuestions(selected,rng),answers:[],confirmed:[],marked:[],notes:[],current:0,seed,rng:null,timer:null,remaining:0,deadline:0,part1Done:true,inBreak:false,breakReason:'',startTime:Date.now(),topic,learnCount:countVal,finished:false};
  toggleControls(true);
  $('finishBtn').textContent='Lernmodus beenden';
  $('time').textContent='--:--';
  saveSession();
  renderQuestion();
}

function setTimer(seconds){
  clearInterval(state.timer);
  state.remaining=seconds;
  state.deadline=Date.now()+seconds*1000;
  updateTimer();
  state.timer=setInterval(tickTimer,1000);
  saveSession();
}
function resumeTimer(){
  clearInterval(state.timer);
  tickTimer();
  if(state.remaining>0)state.timer=setInterval(tickTimer,1000);
}
function tickTimer(){
  if(state.finished||state.inBreak){clearInterval(state.timer);return}
  state.remaining=Math.max(0,Math.ceil(((state.deadline||Date.now())-Date.now())/1000));
  updateTimer();
  if(state.remaining<=0){
    clearInterval(state.timer);
    handleTimerExpired();
  }else if(state.remaining%5===0){
    saveSession();
  }
}
function handleTimerExpired(){
  if(state.mode==='exam'&&!state.part1Done){
    submitPart1('Die Zeit für Prüfungsteil 1 ist abgelaufen.');
  }else{
    finishSession(true);
  }
}

function questionUnit(q){
  if(q.unit!==undefined)return q.unit;
  if(q.type!=='short')return '';
  if(/Prozentsatz|Prozent/i.test(q.prompt))return '%';
  if(/wie viele Tage|Tage bedeutet/i.test(q.prompt))return 'Tage';
  if(/Euro|Entschädigung|Leistung|Betrag|Kapitalbedarf|Ablaufleistung|Mietausfall/i.test(q.prompt))return 'Euro';
  return '';
}
function formatNumber(v){
  const n=parseNumber(v);
  if(!Number.isFinite(n))return String(v);
  return new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(Math.round(n*100)/100);
}
function buildAnswerInput(q){
  const ans=state.answers[state.current];
  const confirmed=state.mode==='learn'&&state.confirmed[state.current];
  if(q.type==='single'){
    return '<div class="options">'+q.shuffled.map((o,i)=>{
      const selected=ans===i;let cls='opt';
      if(confirmed&&i===q.correct)cls+=' correct';
      if(confirmed&&selected&&i!==q.correct)cls+=' wrong';
      return `<label class="${cls}"><input type="radio" name="ans" value="${i}" ${selected?'checked':''} onchange="saveSingle(${i})"><span>${escapeHtml(o)}</span></label>`;
    }).join('')+'</div>';
  }
  if(q.type==='multiple'){
    const arr=Array.isArray(ans)?ans:[];
    return `<p class="small muted">Es können mehrere Antworten richtig sein. Gewertet wird nur die vollständig richtige Auswahl.</p><div class="options">`+q.shuffled.map((o,i)=>{
      const selected=arr.includes(i);let cls='opt';
      if(confirmed&&q.correct.includes(i))cls+=' correct';
      if(confirmed&&selected&&!q.correct.includes(i))cls+=' wrong';
      return `<label class="${cls}"><input type="checkbox" value="${i}" ${selected?'checked':''} onchange="saveMulti(${i},this.checked)"><span>${escapeHtml(o)}</span></label>`;
    }).join('')+'</div>';
  }
  const val=escapeHtml(ans??'');
  const unit=questionUnit(q);
  const suffix=unit?` <span class="unitSuffix">${escapeHtml(unit)}</span>`:'';
  const hint=unit==='Euro'?'Eingabe in Euro; deutsche Dezimalschreibweise ist möglich, z. B. 5812,50.':unit==='%'?'Nur den Zahlenwert eingeben, z. B. 10.':'Nur den gefragten Wert eingeben.';
  return `<div class="short"><input id="shortInput" value="${val}" placeholder="Antwort eingeben" inputmode="decimal" oninput="saveShort(this.value)">${suffix}</div><div class="inputHint">${hint}</div>`;
}
function answerText(q){
  if(q.type==='single')return q.shuffled[q.correct];
  if(q.type==='multiple')return q.correct.map(i=>q.shuffled[i]).join(' | ');
  if(q.numeric){const unit=questionUnit(q);return formatNumber(q.answer)+(unit?` ${unit}`:'')}
  return Array.isArray(q.answer)?q.answer[0]:q.answer;
}

function v8RenderQuestion(){
  if(!state.questions.length){showStart();return}
  const q=state.questions[state.current];
  $('subtitle').textContent=state.mode==='exam'?`Schriftlicher Prüfungsteil ${q.part}`:'Lernmodus';
  $('band').textContent=q.category;
  const progress=((state.current+1)/state.questions.length)*100;
  const typeText=q.type==='single'?'Einfachauswahl':q.type==='multiple'?'Mehrfachauswahl':'Kurzantwort';
  const input=buildAnswerInput(q);
  const confirmed=state.mode==='learn'&&state.confirmed[state.current];

  if(remote&&(!cached||cached.version!==remote.version)){
    showLoading('Inhalte werden geladen',10);
    try{
      const r=await sbFetch('/storage/v1/object/authenticated/inhalte/'+encodeURIComponent(remote.datei),{method:'GET'});
      if(!r.ok)return cached?(applyContent(cached),{ok:true}):{error:r.status===403||r.status===400?'gesperrt':'laden'};
      showLoading('Inhalte werden geladen',70);
      const c=await r.json();
      c.version=c.version||remote.version;
      await idbPut('inhalt',c);
      applyContent(c);
      return {ok:true};
    }catch(e){if(cached){applyContent(cached);return {ok:true}}return {error:'laden'}}
  }
  if(cached){applyContent(cached);return {ok:true}}
  return {error:navigator.onLine===false?'offline':'laden'};
}

function queueKey(){return 'lad34d_queue_'+(AUTH.user?AUTH.user.id:'gast')}

function setQueue(q){try{localStorage.setItem(queueKey(),JSON.stringify(q))}catch(e){}}
function attemptPayload(entry,examPart){
  const groups=entry.groups||{};
  let passed=null;
  if(entry.mode==='exam'){
    const ps=Object.values(groups).map(g=>g.p);
    if(examPart)passed=ps.length>0&&ps.every(p=>p>=50);
    else passed=ps.length===5&&ps.filter(p=>p>=50).length>=4&&!ps.some(p=>p<30);
  }
  return {client_id:String(entry.id),created_at:entry.date,mode:entry.mode==='exam'?(examPart?'exam'+examPart:'exam'):entry.mode,topic:entry.topic||'',total:entry.total,correct:entry.correct,percent:entry.percent,passed,groups,categories:entry.categories||{},duration_sec:entry.durationSec||0};
}

function selectUnique(candidates,count,rng){
  const map=groupByKey(candidates);let keys=[...map.keys()];shuffle(keys,rng);
  if(!NO_SEEN_PREF){const seen=seenMap();keys=keys.map((k,i)=>({k,i,b:seen[k]?Math.floor(seen[k]/DAY)+1:0})).sort((a,b)=>a.b-b.b||a.i-b.i).map(x=>x.k)}
  const out=[],uids=new Set();
  for(const k of keys){const arr=map.get(k);const q=arr[Math.floor(rng()*arr.length)];out.push(clone(q));uids.add(q.uid||q);if(count!=='all'&&out.length>=count)break}
  if(count!=='all'&&out.length<count){const pool=candidates.filter(q=>!uids.has(q.uid||q)).map(clone);shuffle(pool,rng);for(const q of pool){out.push(q);if(out.length>=count)break}}
  return out;
}
function prepareQuestions(list,rng){return list.map((q,idx)=>{const x=clone(q);x.part=x.part||(x.group==='D'||x.group==='E'?2:1);if(x.type==='single'||x.type==='multiple'){const pairs=(x.options||[]).map((t,i)=>({t,i}));shuffle(pairs,rng);x.shuffled=pairs.map(p=>p.t);x.perm=pairs.map(p=>p.i);if(x.type==='single'){x.correct=pairs.findIndex(p=>p.i===x.answer)}else{x.correct=pairs.map((p,i)=>Array.isArray(x.answer)&&x.answer.includes(p.i)?i:null).filter(v=>v!==null)}}else{x.correct=x.answer}x.sessionId=idx;return x})}

  const manual=($('seedInput')?.value||'').trim();const seed=manual||makeSeed('P');
  const rng=mulberry32(hashSeed(seed));const part1=[],part2=[];

  try{GROUP_ORDER.forEach(g=>{const sel=selectExamGroup(g,EXAM_DIST[g],rng);if(g==='A'||g==='B'||g==='C')part1.push(...sel);else part2.push(...sel)})}finally{NO_SEEN_PREF=false}
  shuffle(part1,rng);shuffle(part2,rng);
  const qs=part1.concat(part2);markSeen(qs.map(baseKey));
  state={mode:'exam',questions:prepareQuestions(qs,rng),answers:[],confirmed:[],marked:[],notes:[],current:0,seed,rng:null,timer:null,remaining:0,deadline:0,part1Done:false,inBreak:false,breakReason:'',startTime:Date.now(),topic:'Prüfung',learnCount:'118',finished:false};

function startLearning(topicArg,countArg){
  closeModal();
  let topic=topicArg||$('studyTopic')?.value||'all';
  if(!topicArg){if($('fNeu')?.checked)topic+='~neu';if($('fUnseen')?.checked)topic+='~ungesehen'}
  const countVal=countArg||$('learnCount')?.value||'40';
  const manual=($('learnSeedInput')?.value||'').trim();const seed=manual||makeSeed('L');
  const rng=mulberry32(hashSeed(seed));const candidates=filteredByTopic(topic);
  if(!candidates.length){modal('Keine Aufgaben','Für diese Auswahl gibt es keine Aufgaben. Bitte wählen Sie einen anderen Filter.');return}
  const count=countVal==='all'?'all':Number(countVal);
  NO_SEEN_PREF=!!manual;let selected;try{selected=selectUnique(candidates,count,rng)}finally{NO_SEEN_PREF=false}

function repeatLastLearning(){const t=String(state.topic||'all');if(t==='Fehlerkartei')return startKartei();if(t.startsWith('Verständnis-Check: '))return startCheck(t.replace('Verständnis-Check: ',''));startLearning(t!=='Prüfung'?t:'all',state.learnCount||'40')}
function filteredByTopic(topic){
  const parts=String(topic||'all').split('~'),b=parts[0];let list;
  if(!b||b==='all')list=BANK.slice();
  else if(b==='P|1')list=BANK.filter(q=>(q.part||1)===1);
  else if(b==='P|2')list=BANK.filter(q=>(q.part||1)===2);
  else if(b==='S|numeric')list=BANK.filter(q=>q.numeric===true);
  else if(b==='S|triple')list=BANK.filter(q=>q.type==='multiple'&&Array.isArray(q.answer)&&q.answer.length===3);
  else if(b.startsWith('G|'))list=BANK.filter(q=>q.group===b.slice(2));
  else if(b.startsWith('C|'))list=BANK.filter(q=>q.category===b.slice(2));
  else if(b.startsWith('T|'))list=BANK.filter(q=>q.thema===b.slice(2));
  else list=BANK.slice();
  if(parts.includes('neu'))list=list.filter(q=>q.neu);
  if(parts.includes('ungesehen')){const s=seenMap();list=list.filter(q=>!s[baseKey(q)])}
  return list;
}
function topicLabel(v){

function origIndex(q,i){if(Array.isArray(q.perm)&&q.perm[i]!=null)return q.perm[i];return (q.options||[]).indexOf(q.shuffled[i])}
function isRightOpt(q,i){return q.type==='single'?i===q.correct:(Array.isArray(q.correct)&&q.correct.includes(i))}
function isChosen(q,a,i){return q.type==='single'?a===i:(Array.isArray(a)&&a.includes(i))}
function explainHtml(q,a){
  const rich=Array.isArray(q.optExpl)&&q.optExpl.length>0&&Array.isArray(q.shuffled);
  const steps=Array.isArray(q.steps)&&q.steps.length?q.steps:null;
  if(!rich&&!steps&&!q.merksatz&&!q.fehlerfalle)return `<p><strong>Richtige Antwort:</strong> ${escapeHtml(answerText(q))}</p><p><strong>Begründung:</strong> ${escapeHtml(q.explanation)}</p><p><strong>Fachliche Grundlage:</strong> ${escapeHtml(q.ref)}</p>`;
  let h='';
  if(rich)h+='<div class="optExplList">'+q.shuffled.map((t,i)=>{const r=isRightOpt(q,i),c=isChosen(q,a,i),why=q.optExpl[origIndex(q,i)]||'';return `<div class="optExpl ${r?'isRight':'isWrong'}${c?' chosen':''}"><div class="optHead"><span class="${r?'ok':'bad'}">${r?'richtig':'falsch'}</span>${c?'<span class="pill">Ihre Wahl</span>':''}</div><div class="optText">${escapeHtml(t)}</div>${why?`<div class="why">${escapeHtml(why)}</div>`:''}</div>`}).join('')+'</div>';
  else h+=`<p><strong>Richtige Antwort:</strong> ${escapeHtml(answerText(q))}</p>`;
  h+=`<p><strong>Erklärung:</strong> ${escapeHtml(q.explanation)}</p>`;
  if(steps)h+=`<p><strong>Rechenweg:</strong></p><ol class="steps">${steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>`;
  if(q.merksatz)h+=`<div class="merkbox"><strong>Merksatz:</strong> ${escapeHtml(q.merksatz)}</div>`;
  if(q.fehlerfalle)h+=`<div class="fallebox"><strong>Fehlerfalle:</strong> ${escapeHtml(q.fehlerfalle)}</div>`;
  h+=`<p class="small"><strong>Fundstelle:</strong> ${escapeHtml(q.ref)}</p>`;
  return h;
}
function feedbackBlock(q){
  const a=state.answers[state.current],ok=isCorrect(q,a),last=state.current>=state.questions.length-1;
  const nav=state.mode!=='learn'?'':`<p class="row">${last?(state.check?'<button class="btn" onclick="finishSession(false)">Check auswerten</button>':'<button class="btn" onclick="requestFinish()">Lernmodus auswerten</button>'):'<button class="btn" onclick="go(1)">Nächste Aufgabe</button>'}</p>`;

}

/* ---------- Fortschritt je Grundaufgabe und Fehlerkartei ---------- */
const BOX_DAYS={1:1,2:3,3:7};
function getProg(){return lsGet('prog',{})}
function setProg(p){lsSet('prog',p)}
function recordProgress(items){
  if(!items.length)return;const p=getProg(),now=Date.now(),iso=new Date(now).toISOString();
  items.forEach(({q,ok})=>{const k=baseKey(q);const e=p[k]||{box:0,st:0,seen:0,r:0,w:0};
    e.seen=(e.seen||0)+1;e.lc=!!ok;e.la=iso;
    if(ok){e.r=(e.r||0)+1;e.st=(e.st||0)+1;if(e.box>=1&&e.box<=3){if(e.st>=3){e.box=4;e.due=null}else{e.box=Math.min(3,e.st+1);e.due=new Date(now+BOX_DAYS[e.box]*DAY).toISOString()}}}
    else{e.w=(e.w||0)+1;e.st=0;e.box=1;e.due=new Date(now+BOX_DAYS[1]*DAY).toISOString()}
    e.u=iso;e.dirty=1;p[k]=e});
  setProg(p);
}
function karteiItems(){const p=getProg(),keys=new Set(BANK.map(baseKey));return Object.entries(p).filter(([k,e])=>e.box>=1&&e.box<=3&&keys.has(k)).map(([k,e])=>({k,e}))}
function isDue(e){return !e.due||Date.parse(e.due)<=Date.now()}
function startKartei(){
  closeModal();const items=karteiItems();
  if(!items.length){modal('Fehlerkartei ist leer','Falsch beantwortete Aufgaben landen automatisch hier.');return}
  const due=items.filter(x=>isDue(x.e)).sort((a,b)=>(Date.parse(a.e.due||0)||0)-(Date.parse(b.e.due||0)||0));
  const pick=due.length?due.slice(0,20):items.slice().sort((a,b)=>(Date.parse(a.e.la||0)||0)-(Date.parse(b.e.la||0)||0)).slice(0,20);
  const seed=makeSeed('K'),rng=mulberry32(hashSeed(seed)),m=groupByKey(BANK);
  const qs=pick.map(x=>{const arr=m.get(x.k);return clone(arr[Math.floor(rng()*arr.length)])});
  shuffle(qs,rng);beginLearn(qs,rng,seed,'Fehlerkartei');
}
let progBusy=false;
async function flushProgress(){
  if(!AUTH.user||navigator.onLine===false||progBusy)return;
  const rows=Object.entries(getProg()).filter(([k,e])=>e.dirty).map(([k,e])=>({user_id:AUTH.user.id,question_id:k,box:e.box||0,seen:e.seen||0,right_count:e.r||0,wrong_count:e.w||0,last_correct:e.lc==null?null:!!e.lc,last_answer:e.la||null,due_at:e.due||null,updated_at:e.u||new Date().toISOString()}));
  if(!rows.length)return;progBusy=true;
  try{
    for(let i=0;i<rows.length;i+=500){const r=await sbFetch('/rest/v1/question_progress?on_conflict=user_id,question_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+500))});if(!r.ok)return}
    const p=getProg();rows.forEach(x=>{const e=p[x.question_id];if(e&&e.u===x.updated_at)delete e.dirty});setProg(p);
  }finally{progBusy=false}
}
async function pullProgress(){
  if(!AUTH.user)return;const p=getProg();let ch=false;
  for(let off=0;off<50000;off+=1000){
    const r=await sbFetch('/rest/v1/question_progress?select=question_id,box,seen,right_count,wrong_count,last_correct,last_answer,due_at,updated_at&order=question_id.asc&limit=1000&offset='+off,{method:'GET'});
    if(!r.ok)break;const rows=await r.json();if(!Array.isArray(rows))break;
    rows.forEach(x=>{const e=p[x.question_id],ru=Date.parse(x.updated_at||0)||0,lu=e?(Date.parse(e.u||0)||0):-1;if(!e||ru>lu){p[x.question_id]={box:x.box||0,st:x.box===4?3:Math.max(0,(x.box||0)-1),seen:x.seen||0,r:x.right_count||0,w:x.wrong_count||0,lc:x.last_correct,la:x.last_answer,due:x.due_at,u:x.updated_at};ch=true}});
    if(rows.length<1000)break;
  }
  if(ch)setProg(p);
}

function areaCard(b,agg){

  const bases=b==='Einstieg'?0:new Set(BANK.filter(q=>q.category===b).map(baseKey)).size;
  const info=b==='Einstieg'?'<span class="pill">Check mit 5 gemischten Aufgaben</span>':`<span class="pill">${bases} Aufgaben</span><span class="pill">${v&&v.n?'Quote '+pct(v.c,v.n)+' Prozent':'noch keine Quote'}</span>`;
  return `<div class="card areaCard" data-area="${escapeAttr(b)}"><h3>${escapeHtml(l?l.titel:b)}</h3><p class="small muted">${escapeHtml(b)}${l&&l.dauer_min?' · etwa '+l.dauer_min+' Minuten':''}</p><p><span class="pill${st==='bestanden'?' pillOk':''}">${STATUS_TEXT[st]}</span>${info}</p>${l?'':'<p class="small muted">Für diesen Bereich gibt es noch keine Einführung. Nutzen Sie Check, Aufgaben und Karteikarten.</p>'}<div class="row">${l?`<button class="btn" onclick="openLesson('${escapeAttr(b)}')">${st==='offen'?'Kapitel starten':'Kapitel öffnen'}</button>`:''}<button class="btn secondary" onclick="startCheck('${escapeAttr(b)}')">Verständnis-Check</button></div></div>`;
}
function showAreas(){
  setView('areas','Lernbereich','Einführungen');
  const agg=aggregateHistory(getHistory()).cat,areas=areaList();
  let html=`<div class="start"><p><button class="btn secondary" onclick="showStart()">Hauptmenü</button></p><h2>Lernbereich: Einführungen</h2><p>Jedes Kapitel erklärt einen Bereich Schritt für Schritt. Am Ende prüfen Sie Ihr Verständnis mit 10 Aufgaben. Danach wiederholen Sie die wichtigsten Zahlen mit Karteikarten. Ab 80 Prozent richtig gilt das Kapitel als bestanden.</p><div class="cards">${areaCard('Einstieg',agg)}</div>`;
  [1,2].forEach(t=>{html+=`<h3>Prüfungsteil ${t}</h3>`;AREA_GROUPS.filter(x=>x.teil===t).forEach(x=>{const as=x.areas.filter(a=>areas.includes(a));if(as.length)html+=`<p class="small"><strong>${escapeHtml(GROUPS[x.g].name)}</strong></p><div class="cards">${as.map(a=>areaCard(a,agg)).join('')}</div>`})});

/* ---------- Kapitel Schritt für Schritt ---------- */
function paras(t){return String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${escapeHtml(x)}</p>`).join('')}
function ulist(a){return Array.isArray(a)&&a.length?`<ul>${a.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}
function lessonSteps(l){
  const st=[];
  st.push({t:'Lernziel',h:`<h2>${escapeHtml(l.titel)}</h2><p><span class="pill">Lesezeit etwa ${Number(l.dauer_min)||8} Minuten</span><span class="pill">${escapeHtml(l.bereich)}</span></p><div class="merkbox"><strong>Lernziel:</strong> ${escapeHtml(l.ziel||'')}</div><p>Gehen Sie mit „Weiter“ Schritt für Schritt durch das Kapitel. Am Ende folgt ein kurzer Verständnis-Check.</p>`});
  (l.abschnitte||[]).forEach(a=>st.push({t:a.ueberschrift||'Abschnitt',h:`<h2>${escapeHtml(a.ueberschrift||'')}</h2>${paras(a.text)}${ulist(a.punkte)}`}));
  if(Array.isArray(l.merksaetze)&&l.merksaetze.length)st.push({t:'Merksätze',h:`<h2>Merksätze</h2><div class="merkbox">${ulist(l.merksaetze)}</div>`});
  if(l.praxisfall&&l.praxisfall.situation)st.push({t:'Praxisfall',h:`<h2>Praxisfall</h2>${paras(l.praxisfall.situation)}<details class="review-item"><summary>Lösung anzeigen</summary><div class="review-body">${paras(l.praxisfall.loesung)}</div></details>`});
  if(l.rechenweg&&Array.isArray(l.rechenweg.schritte)&&l.rechenweg.schritte.length)st.push({t:'Rechenweg',h:`<h2>${escapeHtml(l.rechenweg.titel||'Rechenweg')}</h2><ol class="steps">${l.rechenweg.schritte.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>`});
  if(Array.isArray(l.fallen)&&l.fallen.length)st.push({t:'Typische Prüfungsfallen',h:`<h2>Typische Prüfungsfallen</h2><div class="fallebox">${ulist(l.fallen)}</div>`});
  if(Array.isArray(l.zahlen)&&l.zahlen.length)st.push({t:'Zahlen und Fristen',h:`<h2>Zahlen und Fristen</h2><div class="tableScroll"><table class="resulttable"><tr><th>Begriff</th><th>Wert</th><th>Quelle</th></tr>${l.zahlen.map(z=>`<tr><td>${escapeHtml(z.begriff)}</td><td>${escapeHtml(z.wert)}</td><td class="small">${escapeHtml(z.quelle||'')}</td></tr>`).join('')}</table></div>`});
  st.push({t:'Fundstellen',h:`<h2>Fundstellen</h2>${ulist(l.quellen)||'<p>Proximus 5 und Werte 2026.</p>'}<div class="sourcebox"><strong>Kapitel durchgearbeitet.</strong> Prüfen Sie jetzt Ihr Verständnis mit dem Check. Danach folgen die Karteikarten des Bereichs.</div>`});
  return st;
}
function openLesson(b){
  const l=lessonFor(b);if(!l){startCheck(b);return}
  setView('lesson','Einführung',b);
  if(lessonStatus(b)==='offen')setLessonStatus(b,{started:new Date().toISOString()});
  LES={b,steps:lessonSteps(l),i:0};renderLesson();
}
function lessonGo(d){if(!LES)return;LES.i=Math.max(0,Math.min(LES.steps.length-1,LES.i+d));renderLesson()}
function renderLesson(){
  const n=LES.steps.length,i=LES.i,s=LES.steps[i];
  if(i===n-1&&!(getLessons()[LES.b]||{}).read)setLessonStatus(LES.b,{read:new Date().toISOString()});
  $('screen').innerHTML=`<div class="start lesson"><div class="lessonTop"><span class="small muted"><strong>Schritt ${i+1} von ${n}</strong> · ${escapeHtml(s.t)}</span><button class="btn secondary" onclick="showAreas()">Zur Übersicht</button></div><div class="progress"><div style="width:${Math.round((i+1)/n*100)}%"></div></div><div class="lessonBody">${s.h}</div><div class="navRow"><button class="btn secondary" onclick="lessonGo(-1)"${i===0?' disabled':''}>Zurück</button>${i<n-1?'<button class="btn" onclick="lessonGo(1)">Weiter</button>':`<button class="btn" onclick="startCheck('${escapeAttr(LES.b)}')">Verständnis-Check starten</button>`}</div></div>`;
  const c=document.querySelector('.content');if(c)c.scrollTop=0;window.scrollTo(0,0);
}

/* ---------- Verständnis-Check ---------- */
function startCheck(b){
  closeModal();
  const ein=b==='Einstieg',cands=BANK.filter(q=>ein||q.category===b);
  if(!cands.length){modal('Keine Aufgaben','Für diesen Bereich gibt es noch keine Aufgaben.');return}
  const seen=seenMap(),seed=makeSeed('V'),rng=mulberry32(hashSeed(seed));
  const rank=list=>{const m=groupByKey(list);let keys=[...m.keys()];shuffle(keys,rng);const sc=k=>{const q=m.get(k)[0];return (seen[k]?4:0)+(q.neu?0:2)+((Array.isArray(q.optExpl)&&q.optExpl.length)||(Array.isArray(q.steps)&&q.steps.length)?0:1)};return keys.map((k,i)=>({k,i,s:sc(k)})).sort((x,y)=>x.s-y.s||x.i-y.i).map(x=>{const arr=m.get(x.k);return clone(arr[Math.floor(rng()*arr.length)])})};
  let qs=ein?GROUP_ORDER.map(g=>rank(cands.filter(q=>q.group===g))[0]).filter(Boolean):rank(cands).slice(0,10);
  shuffle(qs,rng);
  beginLearn(qs,rng,seed,'Verständnis-Check: '+b,{check:{b,n:qs.length}});
}
function finishCheck(stats){
  const c=state.check,wrong=state.questions.map((q,i)=>({q,a:state.answers[i],i})).filter(x=>!isCorrect(x.q,x.a));
  const p=pct(stats.correct,stats.total);
  CHK={b:c.b,correct:stats.correct,total:stats.total,p,passed:p>=80,wrong};
  state={...state,mode:'checkdone',check:null};
  if(CHK.passed){setLessonStatus(c.b,{passed:new Date().toISOString(),best:p,dirty:1});pushLessons().catch(()=>{})}else setLessonStatus(c.b,{last:p});
  flushProgress().catch(()=>{});
  const cards=cardsFor(c.b).slice(0,12);
  if(cards.length)startCards(cards,{title:'Karteikarten: '+c.b,done:showCheckResult,intro:'Zum Abschluss wiederholen Sie die wichtigsten Zahlen und Begriffe des Bereichs.'});else showCheckResult();
}
function showCheckResult(){
  const c=CHK;if(!c){showStart();return}
  setView('checkresult','Verständnis-Check',c.b);
  const areas=areaList(),next=areas[areas.indexOf(c.b)+1];
  const head=c.passed?`<h2 class="ok">Kapitel bestanden</h2><p>Sie haben ${c.correct} von ${c.total} Aufgaben richtig beantwortet. Das sind ${c.p} Prozent.</p>`:`<h2 class="bad">Noch nicht sicher</h2><p>Sie haben ${c.correct} von ${c.total} Aufgaben richtig beantwortet. Das sind ${c.p} Prozent. Zum Bestehen brauchen Sie mindestens 80 Prozent.</p><p><strong>Noch nicht sicher. Gehen Sie das Kapitel noch einmal durch.</strong></p>`;
  const btns=`<div class="row">${c.passed&&next?`<button class="btn" onclick="openLesson('${escapeAttr(next)}')">Nächstes Kapitel: ${escapeHtml(next)}</button>`:''}${lessonFor(c.b)?`<button class="btn${c.passed?' secondary':''}" onclick="openLesson('${escapeAttr(c.b)}')">Kapitel wiederholen</button>`:''}<button class="btn secondary" onclick="startCheck('${escapeAttr(c.b)}')">Check wiederholen</button><button class="btn secondary" onclick="showAreas()">Zur Übersicht</button><button class="btn secondary" onclick="showStart()">Hauptmenü</button></div>`;
  const wrong=c.wrong.length?`<h3>Falsch beantwortete Aufgaben</h3>${c.wrong.map(x=>reviewHtml(x.q,x.a,x.i)).join('')}`:'<p class="ok">Alle Aufgaben richtig.</p>';
  $('screen').innerHTML=`<div class="start">${head}${btns}${wrong}</div>`;
}

/* ---------- Karteikarten mit Leitner-Logik ---------- */
const CARD_DAYS=[0,1,3,7,14,30];
function getCardState(){return lsGet('cards',{})}
function cardDue(id,cs){const e=(cs||getCardState())[id];return !e||!e.due||Date.parse(e.due)<=Date.now()}
function cardsFor(sel){
  const cs=getCardState();let list=KARTEN.filter(k=>sel==='all'||sel==='due'||k.bereich===sel);
  if(sel==='due')list=list.filter(k=>cardDue(k.id,cs));
  list=shuffle(list.slice(),Math.random);
  return list.map((k,i)=>({k,i,d:cardDue(k.id,cs)?0:1})).sort((a,b)=>a.d-b.d||a.i-b.i).map(x=>x.k);
}
function cardSelLabel(sel){return sel==='all'?'alle Bereiche':sel==='due'?'fällige Karten':sel}
function startCardsSel(sel,n){let list=cardsFor(sel);if(n!=='all')list=list.slice(0,Number(n)||40);if(!list.length){modal('Keine Karten','Für diese Auswahl sind gerade keine Karten fällig.');return}startCards(list,{title:'Karteikarten: '+cardSelLabel(sel)})}
function startCardsFromStart(){startCardsSel($('cardSel')?.value||'all',$('cardCount')?.value||'40')}
function startCards(list,opts){setView('cards','Karteikarten','Karteikarten');CS=Object.assign({list,i:0,flip:false,known:0,unknown:[],title:'Karteikarten',done:null,intro:''},opts||{});renderCard()}
function renderCard(){
  const c=CS.list[CS.i],n=CS.list.length;
  $('band').textContent=c.bereich||'Karteikarten';
  $('screen').innerHTML=`<div class="start"><div class="lessonTop"><strong>${escapeHtml(CS.title)}</strong><span class="small muted"><strong>${CS.i+1} von ${n}</strong></span></div><div class="progress"><div style="width:${Math.round(CS.i/n*100)}%"></div></div>${CS.intro&&CS.i===0&&!CS.flip?`<p class="small muted">${escapeHtml(CS.intro)}</p>`:''}<div class="flashcard${CS.flip?' back':''}" onclick="flipCard()" role="button" tabindex="0"><div class="small muted">${CS.flip?'Rückseite':'Vorderseite'} · ${escapeHtml(c.bereich||'')}</div><div class="fcText">${escapeHtml(CS.flip?c.hinten:c.vorne)}</div>${CS.flip&&c.quelle?`<div class="small muted">Quelle: ${escapeHtml(c.quelle)}</div>`:''}${CS.flip?'':'<div class="small muted">Tippen Sie auf die Karte, um sie umzudrehen.</div>'}</div><div class="row cardBtns">${CS.flip?'<button class="btn" onclick="rateCard(true)">Gewusst</button><button class="btn secondary" onclick="rateCard(false)">Nicht gewusst</button>':'<button class="btn" onclick="flipCard()">Karte umdrehen</button>'}<button class="btn secondary" onclick="endCards()">${CS.done?'Überspringen':'Beenden'}</button></div></div>`;
}
function flipCard(){if(!CS)return;CS.flip=!CS.flip;renderCard()}
function rateCard(ok){
  const c=CS.list[CS.i],cs=getCardState(),e=cs[c.id]||{box:0};
  if(ok){e.box=Math.min(5,(e.box||0)+1);CS.known++}else{e.box=1;CS.unknown.push(c)}
  e.due=new Date(Date.now()+(ok?CARD_DAYS[e.box]:0)*DAY).toISOString();cs[c.id]=e;lsSet('cards',cs);
  CS.i++;CS.flip=false;if(CS.i>=CS.list.length)cardSummary();else renderCard();
}
function cardsDone(){const f=CS&&CS.done;if(f)f();else showStart()}
function endCards(){if(CS.done)cardsDone();else cardSummary()}
function repeatUnknown(){startCards(CS.unknown.slice(),{title:CS.title,done:CS.done})}
function cardSummary(){
  const done=CS.known+CS.unknown.length;
  $('screen').innerHTML=`<div class="start"><h2>Zusammenfassung</h2><p>Sie haben ${done} von ${CS.list.length} Karten bearbeitet.</p><table class="resulttable"><tr><th>Gewusst</th><td>${CS.known}</td></tr><tr><th>Nicht gewusst</th><td>${CS.unknown.length}</td></tr></table><p class="small muted">Gewusste Karten kommen nach 1, 3, 7, 14 und 30 Tagen wieder. Nicht gewusste Karten bleiben sofort fällig.</p><div class="row">${CS.done?'<button class="btn" onclick="cardsDone()">Weiter zum Ergebnis</button>':''}${CS.unknown.length?`<button class="btn${CS.done?' secondary':''}" onclick="repeatUnknown()">Nicht gewusste wiederholen</button>`:''}${CS.done?'':'<button class="btn secondary" onclick="showStart()">Hauptmenü</button>'}</div></div>`;
}

/* ---------- Lernplan ---------- */
const WD_SETS={1:[6],2:[2,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5],6:[1,2,3,4,5,6],7:[0,1,2,3,4,5,6]};
function getPlan(){return lsGet('plan',null)}
function setPlan(p){lsSet('plan',p)}
function weakAreas(){const agg=aggregateHistory(getHistory()).cat;return areaList().filter(a=>a!=='Einstieg').map((a,i)=>{const v=agg[a];return {a,i,p:v&&v.n>=5?pct(v.c,v.n):-1}}).sort((x,y)=>x.p-y.p||x.i-y.i).map(x=>x.a)}
function planBuild(pl){
  if(!pl||!pl.exam)return null;
  const today=berlinDay(),start=pl.start&&pl.start<=today?pl.start:today,res={exam:pl.exam,daysLeft:dayDiff(today,pl.exam),days:[],compressed:false,over:false,count:{}};
  if(res.daysLeft<=0){res.over=true;return res}
  res.compressed=dayDiff(start,pl.exam)<7;
  const set=new Set(WD_SETS[pl.perWeek]||WD_SETS[5]),last=dayAdd(pl.exam,-1),dates=[];
  for(let k=start;k<pl.exam;k=dayAdd(k,1)){if(res.compressed||k===start||k===last||set.has(dayWd(k)))dates.push(k)}
  const L=dates.length,D=L-1,areas=areaList();
  let p1,p2,p3;
  if(res.compressed){p1=D>0?Math.max(1,Math.ceil(D/2)):0;p3=D-p1;p2=0}
  else{p1=Math.max(1,Math.round(D*0.5));p3=Math.max(Math.min(3,D-p1),Math.round(D*0.2));p2=Math.max(0,D-p1-p3);p3=D-p1-p2}
  if(p1>areas.length){p2+=p1-areas.length;p1=areas.length}
  const weak=weakAreas();let j2=0,j3=0;
  dates.forEach((k,i)=>{
    let phase,tasks=[];
    if(i===L-1){phase='Wiederholung';tasks=[{act:'cards',arg:'due',label:'Karteikarten: fällige Karten wiederholen'},{act:'info',label:'Werteübersicht 2026 durchsehen'}]}
    else if(i<p1){phase='Grundlagen';const ch=areas.slice(Math.floor(i*areas.length/p1),Math.floor((i+1)*areas.length/p1)),n=ch.length>1?20:30;ch.forEach(b=>{if(lessonFor(b))tasks.push({act:'lesson',arg:b,label:'Einführung durcharbeiten: '+b});tasks.push({act:'check',arg:b,label:'Verständnis-Check: '+b});if(b!=='Einstieg')tasks.push({act:'learn',arg:'C|'+b,n,label:n+' Übungsaufgaben: '+b})})}
    else if(i<p1+p2){phase='Vertiefen';const b=weak[j2%Math.max(1,weak.length)]||'Private Vorsorge';j2++;tasks=[{act:'learn',arg:'C|'+b,n:30,label:'30 Aufgaben im schwächsten Bereich: '+b},{act:'learn',arg:'S|numeric',n:20,label:'20 Rechenaufgaben'},{act:'kartei',label:'Fehlerkartei üben'},{act:'cards',arg:'due',label:'Karteikarten: fällige Karten'}]}
    else{phase='Prüfungstraining';const t=(Math.floor(j3/2)%2)+1;tasks=j3%2===0?[{act:'exam',label:'Vollprüfung unter Prüfungsbedingungen'}]:[{act:'part',arg:t,label:'Prüfungsteil '+t+' einzeln'}];j3++;tasks.push({act:'kartei',label:'Fehlerkartei üben'})}
    res.count[phase]=(res.count[phase]||0)+1;res.days.push({date:k,phase,tasks});
  });
  return res;
}
function planGoal(pl){const P=planBuild(pl);if(!P||P.over)return null;const today=berlinDay(),rest=P.days.filter(d=>d.date>=today).length||1,s=seenMap();let open=0;new Set(BANK.map(baseKey)).forEach(k=>{if(!s[k])open++});return Math.min(80,Math.max(20,Math.ceil(open/rest)))}
function runTask(date,j){const P=planBuild(getPlan());const d=P&&P.days.find(x=>x.date===date);const t=d&&d.tasks[j];if(!t)return;
  switch(t.act){case 'lesson':return openLesson(t.arg);case 'check':return startCheck(t.arg);case 'learn':return startLearning(t.arg,String(t.n||20));case 'kartei':return startKartei();case 'cards':return startCardsSel(t.arg||'due','40');case 'exam':return startExam();case 'part':return startExamPart(t.arg);case 'info':return showInfo()}}
function toggleDone(date,on){const pl=getPlan();if(!pl)return;pl.done=pl.done||{};if(on)pl.done[date]=true;else delete pl.done[date];setPlan(pl)}
function doneBox(pl,date){return `<label class="doneBox"><input type="checkbox"${pl.done&&pl.done[date]?' checked':''} onchange="toggleDone('${date}',this.checked)"> erledigt</label>`}
function tasksHtml(d){return `<ul class="taskList">${d.tasks.map((t,j)=>`<li><span>${escapeHtml(t.label)}</span><button class="btn secondary" onclick="runTask('${d.date}',${j})">Starten</button></li>`).join('')}</ul>`}
function planStartCard(){
  const pl=getPlan();
  if(!pl)return '<div class="card"><h3>Lernplan</h3><p>Planen Sie Ihre Vorbereitung Tag für Tag bis zum Prüfungstermin. Die App verteilt Einführungen, Übungen und Prüfungstraining.</p><button class="btn" onclick="showPlan(true)">Lernplan erstellen</button></div>';
  const P=planBuild(pl),today=berlinDay();
  if(P.over)return '<div class="card"><h3>Lernplan</h3><p>Der Prüfungstermin ist erreicht. Sie können einen neuen Plan erstellen.</p><button class="btn secondary" onclick="showPlan(true)">Neuen Plan erstellen</button></div>';
  const d=P.days.find(x=>x.date===today),n=P.days.find(x=>x.date>today),left=`Noch <strong>${P.daysLeft} ${P.daysLeft===1?'Tag':'Tage'}</strong> bis zur Prüfung.`;
  if(!d)return `<div class="card resumeCard"><h3>Heute laut Lernplan</h3><p>${left} Heute ist kein Lerntag.${n?' Nächster Lerntag: '+escapeHtml(dayLabel(n.date))+'.':''}</p><button class="btn secondary" onclick="showPlan()">Lernplan öffnen</button></div>`;
  return `<div class="card resumeCard"><h3>Heute laut Lernplan</h3><p>${left} Phase: <strong>${d.phase}</strong>.</p>${tasksHtml(d)}${doneBox(pl,d.date)}<p><button class="btn secondary" onclick="showPlan()">Lernplan öffnen</button></p></div>`;
}
function v8ShowPlan(edit){
  setView('plan','Lernplan','Lernplan');
  const pl=getPlan(),today=berlinDay();
  let html='<div class="start"><p><button class="btn secondary" onclick="showStart()">Hauptmenü</button></p><h2>Lernplan</h2>';
  if(!pl||edit){
    html+=`<p>Geben Sie Ihren Prüfungstermin und Ihre Lerntage pro Woche ein. Die App plant dann jeden Lerntag bis zur Prüfung.</p><div class="card" style="max-width:520px"><div class="field"><label for="planDate">Prüfungsdatum</label><input type="date" id="planDate" min="${dayAdd(today,1)}" value="${pl?escapeAttr(pl.exam):''}"></div><div class="field"><label for="planDays">Lerntage pro Woche</label><select id="planDays">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}"${n===((pl&&pl.perWeek)||5)?' selected':''}>${n} ${n===1?'Lerntag':'Lerntage'}</option>`).join('')}</select></div><p id="planMsg" class="small"></p><div class="row"><button class="btn" onclick="savePlan()">Plan erstellen</button>${pl?'<button class="btn secondary" onclick="showPlan()">Abbrechen</button>':''}</div></div><p class="small muted">Phase 1 Grundlagen: Einführungen, Verständnis-Checks und Übungen je Bereich. Phase 2 Vertiefen: schwächste Bereiche, Rechenaufgaben, Fehlerkartei und Karteikarten. Phase 3 Prüfungstraining: Vollprüfungen und Prüfungsteile. Am letzten Tag nur Wiederholung.</p>`;
    $('screen').innerHTML=html+'</div>';return;
  }
  const P=planBuild(pl);

  const d=P.days.find(x=>x.date===today),n=P.days.find(x=>x.date>today),goal=planGoal(pl);

function planTasks(pl){const P=planBuild(pl);if(!P||P.over)return null;const all=[];
 P.days.forEach((d,i)=>d.tasks.forEach((t,j)=>all.push(Object.assign({id:d.date+'#'+j,phase:d.phase},t))));
 const today=berlinDay(),set=new Set(WD_SETS[pl.perWeek]||WD_SETS[5]),days=[];
 for(let k=today;k<pl.exam;k=dayAdd(k,1)){if(P.compressed||k===today||k===dayAdd(pl.exam,-1)||set.has(dayWd(k)))days.push(k)}
 const done=pl.tdone||{};const doneToday=all.filter(t=>done[t.id]===today);const open=all.filter(t=>!done[t.id]);
 pl.base=pl.base||{};const baseOpen=pl.base[today]!=null?pl.base[today]:(open.length+doneToday.length);
 if(pl.base[today]==null){pl.base={[today]:baseOpen};setPlanSync(pl)}
 const quota=Math.max(1,Math.ceil(baseOpen/Math.max(1,days.length)));
 const todayOpen=open.slice(0,Math.max(0,quota-doneToday.length));
 const rest=open.slice(todayOpen.length),fut=days.filter(k=>k>today),sched=[{date:today,tasks:doneToday.concat(todayOpen)}];
 fut.forEach((k,i)=>{const a=Math.floor(i*rest.length/fut.length),b=Math.floor((i+1)*rest.length/fut.length);sched.push({date:k,tasks:rest.slice(a,b)})});
 return {P,all,open,done,sched,today,todayOpen,quota,total:all.length,ndone:all.length-open.length};}
function setPlanSync(pl){pl.u=Date.now();setPlan(pl);clearTimeout(window.__plT);window.__plT=setTimeout(pushPlan,1500)}
async function pushPlan(){if(!AUTH.user)return;try{await sbFetch('/rest/v1/profiles?id=eq.'+AUTH.user.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({plan:getPlan()})})}catch(e){}}
async function pullPlan(){if(!AUTH.user)return;try{const r=await sbFetch('/rest/v1/profiles?select=plan&id=eq.'+AUTH.user.id,{method:'GET'});if(!r.ok)return;const x=(await r.json())[0];const loc=getPlan();
 if(x&&x.plan&&x.plan.exam&&(!loc||(x.plan.u||0)>(loc.u||0))){setPlan(x.plan);if(state.mode==='start'||state.mode==='plan')try{showStart()}catch(e){}}else if(loc&&(!x||!x.plan||(loc.u||0)>(x.plan.u||0)))pushPlan()}catch(e){}}
const v8PullProfile=pullProfile;pullProfile=async function(){await v8PullProfile();await pullPlan()};
function planMark(id){const pl=getPlan();if(!pl||!id)return;pl.tdone=pl.tdone||{};if(!pl.tdone[id]){pl.tdone[id]=berlinDay();setPlanSync(pl)}}
function runPlanTask(id){const pl=getPlan();const T=planTasks(pl);const t=T&&T.all.find(x=>x.id===id);if(!t)return;window.__planTask=id;
 if(['lesson','info','cards'].includes(t.act)){planMark(id);window.__planTask=null}
 switch(t.act){case 'lesson':return openLesson(t.arg);case 'check':return startCheck(t.arg);case 'learn':return startLearning(t.arg,String(t.n||20));case 'kartei':return karteiItems().length?startKartei():(planMark(id),showPlan());case 'cards':return startCardsSel(t.arg||'due','40');case 'exam':return startExam();case 'part':return startExamPart(t.arg);case 'info':return showInfo()}}
function planNext(){const T=planTasks(getPlan());if(!T)return;const t=T.open[0];if(t)runPlanTask(t.id);else showPlan()}
function planDayStart(date){const T=planTasks(getPlan());if(!T)return;const d=T.sched.find(x=>x.date===date);const t=d&&d.tasks.find(x=>!T.done[x.id]);runPlanTask(t?t.id:(T.open[0]||{}).id)}
const v8RR3=renderResult;renderResult=function(stats,entry,auto){const id=window.__planTask;window.__planTask=null;if(id)planMark(id);v8RR3(stats,entry,auto);
 if(id&&getPlan())try{const T=planTasks(getPlan());const left=T.todayOpen.length;const h=`<div class="card" id="planNextBox"><h3>Lernplan</h3><p>${left?`Heute noch ${left} ${left===1?'Schritt':'Schritte'}.`:'Ihr Tagesplan ist geschafft. Sie können trotzdem weitermachen, dann wird der Plan für die nächsten Tage leichter.'}</p><button class="btn" onclick="planNext()">${left?'Nächster Schritt':'Weiterlernen'}</button> <button class="btn secondary" onclick="showPlan()">Lernplan öffnen</button></div>`;const s=document.querySelector('#screen');if(s&&!$('planNextBox'))s.insertAdjacentHTML('afterbegin',h)}catch(e){}};
function taskRow(t,T){const ok=!!T.done[t.id];return `<li class="${ok?'tdone':''}"><span>${ok?'✓ ':''}${escapeHtml(t.label)}</span>${ok?'<span class="small muted">erledigt</span>':`<button class="btn secondary" onclick="runPlanTask('${t.id}')">Starten</button>`}</li>`}
planStartCard=function(){const pl=getPlan();
 if(!pl)return '<div class="card"><h3>Lernplan</h3><p>Prüfungstermin eingeben, dann plant die App jeden Tag für Sie.</p><button class="btn" onclick="showPlan(true)">Lernplan erstellen</button></div>';
 const T=planTasks(pl);if(!T)return '<div class="card"><h3>Lernplan</h3><p>Der Prüfungstermin ist erreicht.</p><button class="btn secondary" onclick="showPlan(true)">Neuen Plan erstellen</button></div>';
 const left=T.todayOpen.length,pc=Math.round(100*T.ndone/T.total);
 return `<div class="card resumeCard"><h3>Lernplan für heute</h3><p>Noch <strong>${T.P.daysLeft} ${T.P.daysLeft===1?'Tag':'Tage'}</strong> bis zur Prüfung. Gesamtfortschritt: <strong>${pc} Prozent</strong>.</p><div class="progress"><div style="width:${pc}%"></div></div><p>${left?`Heute: ${left} ${left===1?'Schritt':'Schritte'}.`:'Heute ist alles geschafft.'}</p><button class="btn" onclick="planNext()">${left?'Lernplan für heute starten':'Weiterlernen'}</button> <button class="btn secondary" onclick="showPlan()">Lernplan ansehen</button></div>`};
function showPlan(edit){const pl=getPlan();if(!pl||edit)return v8ShowPlan(edit);const T=planTasks(pl);if(!T)return v8ShowPlan(edit);
 setView('plan','Lernplan','Lernplan');const pc=Math.round(100*T.ndone/T.total),td=T.sched[0];
 let html=`<div class="start"><p><button class="btn secondary" onclick="showStart()">Hauptmenü</button></p><h2>Lernplan</h2>
 <div class="card"><p>Prüfung am <strong>${escapeHtml(dayLong(pl.exam))}</strong>, noch <strong>${T.P.daysLeft} ${T.P.daysLeft===1?'Tag':'Tage'}</strong>.</p><p>${T.ndone} von ${T.total} Schritten erledigt (${pc} Prozent).</p><div class="progress"><div style="width:${pc}%"></div></div>
 <p class="small muted">Der Plan passt sich an. Wenn Sie mehr schaffen, werden die nächsten Tage leichter. Wenn Sie weniger schaffen, wird der Rest auf die übrigen Tage verteilt. Ihr Fortschritt wird gespeichert.</p></div>
 <div class="card resumeCard"><h3>Heute</h3>${td.tasks.length?`<ul class="taskList">${td.tasks.map(t=>taskRow(t,T)).join('')}</ul>`:'<p>Für heute steht nichts an.</p>'}<button class="btn" onclick="planNext()">${T.todayOpen.length?'Lernplan für heute starten':'Weiterlernen'}</button></div><h3>Die nächsten Tage</h3><p class="small muted">Tippen Sie auf einen Tag, um ihn direkt zu starten.</p>`;
 html+=T.sched.slice(1).filter(d=>d.tasks.length).map(d=>`<div class="planDay" style="cursor:pointer" onclick="planDayStart('${d.date}')"><div class="planDayHead"><span><strong>${escapeHtml(dayLabel(d.date))}</strong> · ${escapeHtml(d.tasks[0].phase)}</span><button class="btn secondary">Starten</button></div><div class="small">${d.tasks.map(t=>escapeHtml(t.label)).join(', ')}</div></div>`).join('');
 html+=`<p style="margin-top:14px"><button class="btn secondary" onclick="showPlan(true)">Plan ändern</button> <button class="btn secondary" onclick="deletePlan()">Plan löschen</button></p></div>`;$('screen').innerHTML=html};

boot();
</script>
